{% extends "base.html" %}
{% block title %}Nouvelle Interaction - CRM SMG{% endblock %}
{% block content %}
<div class="container-fluid">
    <h2 class="mb-4">Nouvelle Interaction</h2>
    
    <div class="card p-4">
        <form method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Date</label>
                    <input type="date" name="date" class="form-control" value="{{.today}}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Type</label>
                    <select name="type" class="form-select">
                        <option value="Appel">Appel</option>
                        <option value="Email">Email</option>
                        <option value="Réunion">Réunion</option>
                        <option value="Visite">Visite</option>
                        <option value="Offre">Offre</option>
                        <option value="Suivi">Suivi</option>
                    </select>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Notes</label>
                <textarea name="notes" class="form-control" rows="4" required></textarea>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Résultat</label>
                <select name="resultat" class="form-select">
                    <option value="En attente">En attente</option>
                    <option value="Suivi prévu">Suivi prévu</option>
                    <option value="Convention signée">Convention signée</option>
                    <option value="Refus">Refus</option>
                </select>
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a href="{{ url_for('client_detail', client_id=client_id) }}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
