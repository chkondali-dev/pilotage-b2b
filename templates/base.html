<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CRM SMG{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f5f7fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { background: linear-gradient(180deg, #1a3a5c 0%, #0d2137 100%); min-height: 100vh; }
        .sidebar a { color: rgba(255,255,255,0.85); text-decoration: none; padding: 12px 20px; display: block; border-radius: 8px; margin: 4px 12px; transition: all 0.2s; }
        .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.15); color: white; }
        .sidebar .brand { color: white; font-size: 1.4rem; font-weight: bold; padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .stat-card { background: white; padding: 20px; border-radius: 12px; }
        .stat-card h3 { color: #1a3a5c; font-size: 2rem; font-weight: bold; margin: 0; }
        .stat-card p { color: #6b7280; margin: 5px 0 0; font-size: 0.9rem; }
        .btn-primary { background: #1a3a5c; border: none; }
        .btn-primary:hover { background: #15304d; }
        .table { background: white; border-radius: 12px; overflow: hidden; }
        .badge-status { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar py-3">
                <div class="brand">CRM SMG</div>
                <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' else '' }}">
                    <i class="fas fa-home me-2"></i>Tableau de bord
                </a>
                <a href="{{ url_for('list_clients') }}" class="{{ 'active' if request.endpoint == 'list_clients' else '' }}">
                    <i class="fas fa-users me-2"></i>Clients
                </a>
                <a href="{{ url_for('search') }}" class="{{ 'active' if request.endpoint == 'search' else '' }}">
                    <i class="fas fa-search me-2"></i>Recherche
                </a>
                <a href="{{ url_for('add_client') }}" class="{{ 'active' if request.endpoint == 'add_client' else '' }}">
                    <i class="fas fa-plus me-2"></i>Nouveau Client
                </a>
            </div>
            <div class="col-md-10 py-3">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
