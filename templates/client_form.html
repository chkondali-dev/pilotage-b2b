{% extends "base.html" %}
{% block title %}{% if client %}Modifier{% else %}Nouveau{% endblock %} Client - CRM SMG{% endblock %}
{% block content %}
<div class="container-fluid">
    <h2 class="mb-4">{% if client %}Modifier{% else %}Nouveau{% endblock %} Client</h2>
    
    <div class="card p-4">
        <form method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nom</label>
                    <input type="text" name="nom" class="form-control" value="{{ client.Nom if client else '' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Prénom</label>
                    <input type="text" name="prenom" class="form-control" value="{{ client.Prenom if client else '' }}">
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Téléphone</label>
                    <input type="text" name="telephone" class="form-control" value="{{ client.Telephone if client else '' }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ client.Email if client else '' }}">
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Adresse</label>
                <textarea name="adresse" class="form-control" rows="2">{{ client.Adresse if client else '' }}</textarea>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Effectifs</label>
                    <input type="number" name="effectifs" class="form-control" value="{{ client.Effectifs if client else '0' }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Ranking</label>
                    <select name="ranking" class="form-select">
                        <option value="⭐" {% if client and client.Ranking == '⭐' %}selected{% endif %}>⭐</option>
                        <option value="⭐⭐" {% if client and client.Ranking == '⭐⭐' %}selected{% endif %}>⭐⭐</option>
                        <option value="⭐⭐⭐" {% if client and client.Ranking == '⭐⭐⭐' %}selected{% endif %}>⭐⭐⭐</option>
                    </select>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Commentaire</label>
                <textarea name="commentaire" class="form-control" rows="3">{{ client.Commentaire if client else '' }}</textarea>
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a href="{{ url_for('list_clients') }}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
